backend:
  name: git-gateway
  branch: main

media_folder: "site/images"
public_folder: "/images"

locale: "en"
site_url: "https://simonscattery.be"
display_url: "https://simonscattery.be"
logo_url: "/images/logo.webp"

collections:
  # ─────────────────────────────────────────────────────────── CATS
  - name: "cats"
    label: "Cats"
    label_singular: "cat"
    folder: "content/cats"
    create: true
    slug: "{{fields.name | lower | replace(' ', '-')}}"
    extension: "json"
    format: "json"
    summary: "{{name}}  ·  {{group}}"
    sortable_fields: ["order", "name", "group"]
    fields:
      - { name: "order", label: "Position on the page (0 = first)", widget: "number", default: 99, value_type: "int" }
      - { name: "name", label: "Name", widget: "string",
          hint: "The name at the top of her own page. Put a word between <em> and </em> to show it in italic green." }
      - { name: "card_name", label: "Short name for the card", widget: "text", required: false,
          hint: "Shown on the Kings / Queens page. Press Enter to split it over two lines." }
      - { name: "group", label: "King or Queen", widget: "select",
          options: [{ label: "Queen", value: "queen" }, { label: "King", value: "king" }], default: "queen" }
      - { name: "badge", label: "Badge on the card", widget: "select", required: false,
          options: [{ label: "None", value: "none" },
                    { label: "Champion", value: "champion" },
                    { label: "Neutered", value: "neutered" }], default: "none" }
      - { name: "has_page", label: "Give this cat a page of her own", widget: "boolean", default: true }
      - { name: "show_on_card", label: "Show on the Kings / Queens page", widget: "boolean", default: true,
          hint: "Turn off to keep her page but take her card off the list." }

      - { name: "photo", label: "Main photo (top of her page)", widget: "image", required: false }
      - { name: "card_photo", label: "Photo on the card", widget: "image", required: false,
          hint: "Leave the same as the main photo if you like." }

      - name: "rows"
        label: "Information table"
        label_singular: "line"
        widget: "list"
        required: false
        summary: "{{label}}: {{value}}"
        fields:
          - { name: "label", label: "Left side", widget: "string", hint: "Born, Colour, Sire, Dam, Tests, COI, Pedigree…" }
          - { name: "value", label: "Right side", widget: "string",
              hint: "For a pedigree just paste the PawPeds address. To make a link: Text|address" }

      - { name: "bio", label: "Her story", widget: "text", required: false,
          hint: "Leave one blank line between paragraphs." }
      - { name: "award", label: "Highlighted line (optional)", widget: "string", required: false,
          hint: "Shows in a gold box above the table." }

      # ─────────────── titles & awards
      - { name: "has_titles", label: "This cat has titles or show results", widget: "boolean", default: false,
          hint: "Turn this on to add a titles section to her page." }
      - { name: "titles_heading", label: "Heading of that section", widget: "string", required: false,
          default: "Titles & awards" }
      - name: "titles"
        label: "The titles"
        label_singular: "title"
        widget: "list"
        required: false
        summary: "{{title}} — {{detail}}"
        fields:
          - { name: "title", label: "Title", widget: "string", hint: "Champion, Best Kitten, Best in Show…" }
          - { name: "detail", label: "Where and when", widget: "string", required: false,
              hint: "TICA · 2026, or: Antwerp show, March 2026" }
      - name: "title_photos"
        label: "Photos from the shows"
        label_singular: "photo"
        widget: "list"
        required: false
        field: { name: "image", label: "Photo", widget: "image" }
      - { name: "title_photos_cols", label: "Show photos per row", widget: "select", required: false,
          options: [{ label: "Three", value: "g3" }, { label: "Two", value: "g2" }, { label: "One big photo", value: "g1" }],
          default: "g3" }

      # ─────────────── ordinary gallery
      - name: "gallery"
        label: "Photo gallery"
        label_singular: "photo"
        widget: "list"
        required: false
        field: { name: "image", label: "Photo", widget: "image" }
      - { name: "gallery_caption", label: "Caption above the gallery", widget: "string", required: false }
      - { name: "gallery_cols", label: "Photos per row", widget: "select", required: false,
          options: [{ label: "Three", value: "g3" }, { label: "Two", value: "g2" }, { label: "One big photo", value: "g1" }],
          default: "g3" }

      # ─────────────── video
      - { name: "video", label: "Video (optional)", widget: "file", required: false }
      - { name: "video_poster", label: "Cover picture for the video", widget: "image", required: false }
      - { name: "video_caption", label: "Caption under the video", widget: "string", required: false }

  # ─────────────────────────────────────────────────────── BLOG POSTS
  - name: "posts"
    label: "Blog posts"
    label_singular: "post"
    folder: "content/posts"
    create: true
    slug: "{{fields.title | lower | replace(' ', '-')}}"
    extension: "json"
    format: "json"
    summary: "{{title}}  ·  {{date}}"
    sortable_fields: ["order", "title"]
    fields:
      - { name: "order", label: "Position in the list (0 = newest)", widget: "number", default: 0, value_type: "int" }
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "string", hint: "Written however you like: February 5, 2026" }
      - { name: "excerpt", label: "Short teaser", widget: "text",
          hint: "The couple of lines shown on the blog list." }
      - { name: "image", label: "Main picture", widget: "image", required: false }
      - { name: "body", label: "The article", widget: "text",
          hint: "Each paragraph between <p> and </p>. Each heading between <h2> and </h2>." }
      - { name: "h1", label: "Headline on the post page", widget: "string", required: false }
      - { name: "title_tag", label: "Browser tab text", widget: "string", required: false }
      - { name: "back_text", label: "Wording of the back button", widget: "string", required: false,
          default: "← Back to the blog" }

  # ─────────────────────────────────────────────────────────── PAGES
  - name: "pages"
    label: "Pages"
    files:
      # ─────────── home
      - name: "home"
        label: "Home page"
        file: "content/pages/home.json"
        fields:
          - { name: "title_tag", label: "Browser tab text", widget: "string" }
          - { name: "kick", label: "Small line above the title", widget: "string" }
          - { name: "title", label: "Big title", widget: "string",
              hint: "Put a word between <em> and </em> to show it in italic green." }
          - { name: "lead", label: "Sentence underneath", widget: "text" }
          - name: "buttons"
            label: "The two buttons"
            widget: "list"
            max: 2
            summary: "{{text}} → {{link}}"
            fields:
              - { name: "text", label: "Wording", widget: "string" }
              - { name: "link", label: "Goes to", widget: "string", hint: "For example: kittens.html" }
              - { name: "style", label: "Style", widget: "select",
                  options: [{ label: "Filled", value: "solid" }, { label: "Outline", value: "ghost" }] }
          - name: "badges"
            label: "Small logos under the buttons"
            widget: "list"
            required: false
            fields:
              - { name: "image", label: "Logo", widget: "image" }
              - { name: "alt", label: "Description", widget: "string", required: false }
              - { name: "style", label: "Extra styling", widget: "string", required: false }
          - { name: "about_icon", label: "About — icon", widget: "select",
              options: ["heart", "home", "food", "news", "basket", "tree", "roof", "cat", "paw", "star", "kitchen", "play"] }
          - { name: "about_title", label: "About — heading", widget: "string" }
          - { name: "about_text", label: "About — text", widget: "text",
              hint: "Leave one blank line between paragraphs." }
          - { name: "about_link_text", label: "About — button wording", widget: "string", required: false }
          - { name: "about_link_url", label: "About — button address", widget: "string", required: false }
          - name: "features"
            label: "The three little boxes"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { name: "icon", label: "Icon", widget: "select",
                  options: ["heart", "home", "food", "news", "basket", "tree", "roof", "cat", "paw", "star", "kitchen", "play"] }
              - { name: "title", label: "Heading", widget: "string" }
              - { name: "text", label: "Text", widget: "text" }
          - { name: "news_icon", label: "News — icon", widget: "select",
              options: ["news", "heart", "home", "food", "basket", "tree", "roof", "cat", "paw", "star", "kitchen", "play"] }
          - { name: "news_title", label: "News — heading", widget: "string" }
          - { name: "news_tag", label: "News — little label", widget: "string", required: false }
          - { name: "news_count", label: "How many posts to show", widget: "number", value_type: "int", min: 1, max: 6 }
          - { name: "news_all_text", label: "Wording of the button below", widget: "string" }

      # ─────────── kittens
      - name: "kittens"
        label: "Kittens page"
        file: "content/pages/kittens.json"
        fields:
          - { name: "title_tag", label: "Browser tab text", widget: "string" }
          - { name: "kick", label: "Small line above the title", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "lead", label: "Sentence underneath", widget: "text" }
          - name: "litters"
            label: "Litters"
            label_singular: "litter"
            widget: "list"
            summary: "{{title}}  ·  {{status}}"
            fields:
              - { name: "icon", label: "Icon", widget: "select",
                  options: ["heart", "basket", "paw", "cat", "home", "star", "food", "news", "tree", "roof", "kitchen", "play"] }
              - { name: "title", label: "The pairing", widget: "string" }
              - { name: "status", label: "Little label", widget: "string", hint: "Available, Reserved, Expected…" }
              - { name: "status_off", label: "Show the label in grey", widget: "boolean", default: false }
              - { name: "text", label: "Description", widget: "text", required: false,
                  hint: "You may use <strong> … </strong> to make words bold." }
              - { name: "text_style", label: "Extra styling (leave alone)", widget: "string", required: false }
              - { name: "meta", label: "Extra line (parents, dates…)", widget: "text", required: false,
                  hint: "Links allowed, e.g. <a href=\"cat-kami.html\">Kami</a>" }
              - name: "images"
                label: "Photos"
                label_singular: "photo"
                widget: "list"
                required: false
                field: { name: "image", label: "Photo", widget: "image" }
              - { name: "cols", label: "Photos per row", widget: "select",
                  options: [{ label: "Three", value: "g3" }, { label: "Two", value: "g2" }, { label: "One big photo", value: "g1" }] }

      # ─────────── our area
      - name: "area"
        label: "Our area page"
        file: "content/pages/area.json"
        fields:
          - { name: "title_tag", label: "Browser tab text", widget: "string" }
          - { name: "kick", label: "Small line above the title", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "lead", label: "Sentence underneath", widget: "text" }
          - { name: "intro_title", label: "Opening heading", widget: "string" }
          - { name: "intro_text", label: "Opening text", widget: "text" }
          - name: "sections"
            label: "Photo sections"
            label_singular: "section"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { name: "icon", label: "Icon", widget: "select",
                  options: ["tree", "roof", "cat", "kitchen", "play", "heart", "home", "food", "news", "basket", "paw", "star"] }
              - { name: "title", label: "Heading", widget: "string" }
              - name: "images"
                label: "Photos"
                label_singular: "photo"
                widget: "list"
                field: { name: "image", label: "Photo", widget: "image" }
              - { name: "cols", label: "Photos per row", widget: "select",
                  options: [{ label: "Two", value: "g2" }, { label: "Three", value: "g3" }, { label: "One big photo", value: "g1" }] }

      # ─────────── blog heading
      - name: "blog"
        label: "Blog page heading"
        file: "content/pages/blog.json"
        fields:
          - { name: "title_tag", label: "Browser tab text", widget: "string" }
          - { name: "kick", label: "Small line above the title", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "lead", label: "Sentence underneath", widget: "text" }

      # ─────────── our cats covers
      - name: "ourcats"
        label: "Our cats — cover photos"
        file: "content/pages/_ourcats.json"
        fields:
          - name: "covers"
            label: "Cover photos"
            widget: "object"
            fields:
              - { name: "kings", label: "Photo for Kings", widget: "image" }
              - { name: "queens", label: "Photo for Queens", widget: "image" }
          - { name: "style", label: "Styling (leave alone)", widget: "text", required: false }
          - { name: "header", label: "Heading markup (leave alone)", widget: "text", required: false }

      # ─────────── contact
      - name: "contact"
        label: "Contact details"
        file: "content/pages/contact.json"
        fields:
          - { name: "heading", label: "Heading", widget: "string" }
          - { name: "location", label: "Where you are", widget: "string" }
          - { name: "email", label: "Email address", widget: "string" }
          - { name: "facebook", label: "Facebook address", widget: "string" }
          - { name: "copyright", label: "Small print", widget: "string" }
