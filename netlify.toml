[build]
  command = "npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"

# The editor is not for search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Photos and the video rarely change — let browsers keep them.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
