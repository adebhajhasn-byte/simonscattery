[build]
  command = "npm run build"
  publish = "site"
  # No `ignore` rule on purpose: every publish must build. An earlier version
  # skipped builds when only notes changed, by comparing $CACHED_COMMIT_REF
  # with $COMMIT_REF — but Netlify does not document what that variable holds
  # when it has no earlier build to point at, and if it is empty the command
  # compares the checkout with itself, exits 0, and Netlify cancels the build
  # without a word. The few builds it could save are not worth a rule that can
  # silently stop the website from ever updating.

[build.environment]
  NODE_VERSION = "20"

# The editor is not for search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Photos and the video used to be kept by the browser for a week. That meant a
# photo replaced under the same name went on showing the old picture for days,
# with no way to hurry it along. Now the browser checks first every time: if the
# picture has not changed the server answers "still the same" and nothing is
# downloaded, so this stays just as cheap — but a replaced photo shows up the
# moment the new version of the site is live.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The editor reads this file to tell when a new version of the website has
# actually gone live, so it must never come from a cache.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
